name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # office-copy screenshots are published to the ci-office branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch llama.cpp (pinned)
        run: git clone --depth 1 --branch b11242 https://github.com/ggml-org/llama.cpp third_party/llama.cpp

      - name: Core unit tests
        run: BENCH_REPORT=$PWD/bench-report.txt OFFICE_SAMPLE=$PWD/office-sample.html ./gradlew :core:test --stacktrace
      - name: Publish the reading scorecard
        if: always()
        shell: bash
        run: |
          # The test bench (BenchTest): every field of hundreds of invented documents, right / flagged / silently wrong.
          [ -s bench-report.txt ] || { echo "::notice title=Reading scorecard::no report"; exit 0; }
          python3 - <<'PY'
          t = open('bench-report.txt', encoding='utf-8').read()
          head = t.split('\n== invented')[0][:3800]
          print('::notice title=Reading scorecard::' + head.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY

      - name: Office copy in a real browser
        if: always()
        shell: bash
        run: |
          # The office page made by the phone (sample with invented data from OfficeExportTest), opened in Chrome with
          # the network cut off: password, every tab, details, CSV, dropping an e-invoice, phone width, dark mode.
          [ -s office-sample.html ] || { echo "::error title=Office copy::no sample page"; exit 1; }
          mkdir -p web-check && cd web-check
          npm init -y >/dev/null && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund playwright@1.56.0 >/dev/null
          cp ../web/check-office.mjs .
          set +e
          PW_CHANNEL=chrome node check-office.mjs ../office-sample.html ../core/src/test/resources/fixtures/fattura_elettronica.xml ../office-screens 2>&1 | tee check.log
          code=${PIPESTATUS[0]}
          set -e
          msg=$(tail -20 check.log); msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          if [ $code -eq 0 ]; then echo "::notice title=Office copy::${msg}"; else echo "::error title=Office copy::${msg}"; fi
          exit $code
      - name: Publish office-copy screenshots
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          [ -d office-screens ] && [ "$(ls office-screens/*.png 2>/dev/null | wc -l)" -gt 0 ] || { echo "::notice title=Office screenshots::none"; exit 0; }
          cd office-screens
          git init -q -b ci-office
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.png && git commit -qm "Office copy screenshots of ${GITHUB_SHA::7}"
          if git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-office; then
            echo "::notice title=Office screenshots::published $(ls *.png | wc -l) files for ${GITHUB_SHA::7}"
          else
            echo "::notice title=Office screenshots::push failed"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Check what the app may connect to
        shell: bash
        run: |
          # The merged manifest of the real APK: Google's usage-statistics sender must be gone, and the only
          # permissions about the network are the two the network setting needs.
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          m=$("$aapt2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk)
          if grep -q "TransportBackendDiscovery" <<<"$m"; then echo "::error::usage-statistics sender is in the APK"; exit 1; fi
          grep -o 'android.permission.[A-Z_]*' <<<"$m" | sort -u
          if grep -q "ACCESS_WIFI_STATE" <<<"$m"; then echo "::error::unexpected Wi-Fi permission"; exit 1; fi

      - name: Compile instrumented tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace 2>&1 | tee -a build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface compiler / Gradle errors as annotations so they are visible without the raw log.
          errs=$(grep -E '^e: |error:|^\* What went wrong|^> |Could not |FAILED|CMake Error|ninja: build stopped' build.log | grep -v '^> Task' | head -60)
          errs="${errs//'%'/'%25'}"
          errs="${errs//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errs}"

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/

  # Runs the Room migration and repository tests on a real Android emulator.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # screenshots are published to the ci-screens branch
    steps:
      - uses: actions/checkout@v5
      - name: Fetch llama.cpp (pinned)
        run: git clone --depth 1 --branch b11242 https://github.com/ggml-org/llama.cpp third_party/llama.cpp
      - name: Download a tiny vision model for the AI reader test
        run: |
          mkdir -p ai-test
          curl -fsSL --retry 3 -o ai-test/model.gguf https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/SmolVLM-256M-Instruct-Q8_0.gguf
          curl -fsSL --retry 3 -o ai-test/mmproj.gguf https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
          ls -la ai-test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 1200
          script: chmod +x gradlew && adb shell mkdir -p /data/local/tmp/ai-test && adb push ai-test/model.gguf /data/local/tmp/ai-test/model.gguf && adb push ai-test/mmproj.gguf /data/local/tmp/ai-test/mmproj.gguf && (./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace > inst.log 2>&1; rc=$?; adb shell run-as com.kitchenreceipts.app cat files/ocr-e2e.txt > ocr-e2e.txt 2>/dev/null; adb shell run-as com.kitchenreceipts.app cat files/ai-e2e.txt > ai-e2e.txt 2>/dev/null; adb exec-out run-as com.kitchenreceipts.app tar -cf - -C files/screens . > screens.tar 2>/dev/null; exit $rc)
      # The emulator sometimes fails to boot on a busy runner: one more attempt before calling it a failure.
      - name: Run instrumented tests on emulator (second attempt)
        if: steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 1200
          script: chmod +x gradlew && adb shell mkdir -p /data/local/tmp/ai-test && adb push ai-test/model.gguf /data/local/tmp/ai-test/model.gguf && adb push ai-test/mmproj.gguf /data/local/tmp/ai-test/mmproj.gguf && (./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace > inst.log 2>&1; rc=$?; adb shell run-as com.kitchenreceipts.app cat files/ocr-e2e.txt > ocr-e2e.txt 2>/dev/null; adb shell run-as com.kitchenreceipts.app cat files/ai-e2e.txt > ai-e2e.txt 2>/dev/null; adb exec-out run-as com.kitchenreceipts.app tar -cf - -C files/screens . > screens.tar 2>/dev/null; exit $rc)
      - name: Publish screenshots to the ci-screens branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          # Screenshots of the main screens with invented data (ScreenshotTest), for checking the look.
          # The outcome is reported as a notice, since the job log is not always reachable.
          [ -s screens.tar ] || { echo "::notice title=Screenshots::none (screens.tar $(stat -c %s screens.tar 2>/dev/null || echo missing) bytes)"; exit 0; }
          mkdir -p shots && tar -xf screens.tar -C shots || { echo "::notice title=Screenshots::tar could not be read"; exit 0; }
          ls -la shots
          cd shots
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Screenshots of ${GITHUB_SHA::7}"
          if git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screens; then
            echo "::notice title=Screenshots::published $(ls | wc -l) files for ${GITHUB_SHA::7}"
          else
            echo "::notice title=Screenshots::push failed"
          fi
      - name: Publish OCR end-to-end output
        if: always()
        shell: bash
        run: |
          # Annotations are cut at 4 KB: publish the file in up to 10 chunks.
          python3 - <<'PY'
          import os
          if os.path.exists('ai-e2e.txt') and os.path.getsize('ai-e2e.txt') > 0:
              t = open('ai-e2e.txt', encoding='utf-8', errors='replace').read()[:3800]
              print('::notice title=AI reader on emulator::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          if not os.path.exists('ocr-e2e.txt') or os.path.getsize('ocr-e2e.txt') == 0:
              print('::notice title=OCR end-to-end output::no output file')
          else:
              text = open('ocr-e2e.txt', encoding='utf-8', errors='replace').read()
              chunks = [text[i:i + 3800] for i in range(0, len(text), 3800)][:10]
              for n, c in enumerate(chunks, 1):
                  c = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::notice title=OCR end-to-end output {n}/{len(chunks)}::{c}')
          PY
      - name: Report instrumented test failures
        if: failure()
        shell: bash
        run: |
          # Failing tests from the JUnit XML reports, then Gradle/emulator errors from the log.
          msg=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          out = []
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      out.append(f"{tc.get('classname')}.{tc.get('name')}: " + (fail.text or fail.get('message') or '')[:1500])
          print('\n'.join(out) if out else 'no JUnit results found')
          PY
          )
          # (|| true: no match must not end the step before the report is printed)
          log=$(grep -E 'FAILED|Exception|What went wrong|^> |error:|INSTRUMENTATION|Timeout' inst.log 2>/dev/null | grep -v '^> Task' | head -40 || true)
          all="$msg"$'\n'"--- log ---"$'\n'"$log"
          all="${all//'%'/'%25'}"
          all="${all//$'\n'/'%0A'}"
          echo "::error title=Instrumented tests::${all}"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/

  # Runs the real AI models (Qwen3-VL 2B and 4B, as the app uses them) with the app's own reader code, prompt
  # and grammar on a synthetic invoice photo, and reports how well they read it.
  ai-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Fetch llama.cpp (pinned)
        run: git clone --depth 1 --branch b11242 https://github.com/ggml-org/llama.cpp third_party/llama.cpp
      - name: Build the reader for the desktop
        run: |
          cmake -S tools/ai-cli -B build-cli -DCMAKE_BUILD_TYPE=Release > cmake.log
          cmake --build build-cli --target receipt-ai-cli -j 4 > build-cli.log 2>&1 || (tail -40 build-cli.log; exit 1)
      - uses: actions/cache@v4
        with:
          path: models
          key: qwen3vl-2b-4b-q4km-v1
      - name: Download models
        run: |
          mkdir -p models && cd models
          base=https://huggingface.co/Qwen
          get() { [ -s "$2" ] || curl -fsSL --retry 3 -o "$2" "$1"; }
          get $base/Qwen3-VL-2B-Instruct-GGUF/resolve/main/Qwen3VL-2B-Instruct-Q4_K_M.gguf 2b.gguf
          get $base/Qwen3-VL-2B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf 2b-mmproj.gguf
          get $base/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf 4b.gguf
          get $base/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf 4b-mmproj.gguf
          ls -la
      - name: Download the trained model (not cached, it is replaced when trained again)
        continue-on-error: true
        run: |
          kr=https://huggingface.co/ArdentSun/kitchen-reader-2b/resolve/main
          curl -fsSL --retry 3 -o models/kr.gguf $kr/kitchen-reader-2b-Q4_K_M.gguf
          curl -fsSL --retry 3 -o models/kr-mmproj.gguf $kr/mmproj-kitchen-reader-2b-Q8_0.gguf
          ls -la models/kr*
      - name: Prompt, grammar and invoice photo
        run: |
          pip install --quiet pillow
          mkdir -p ai-run
          AI_EXPORT_DIR=$PWD/ai-run ./gradlew :core:test --tests '*AiModelCheckTest.exportPrompt' --rerun --quiet
          python3 tools/ai-cli/make_invoice.py ai-run
      - name: Run the models
        run: |
          run() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/$4.ppm ai-run/$2 ai-run/grammar.gbnf > ai-run/answer-$3.json 2> ai-run/$3.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/$3.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/$3.log; }
          run 2b instruction.txt 2b-full invoice
          run 2b instruction.txt 2b-crop invoice-crop
          run 4b instruction.txt 4b-crop invoice-crop
          # Whole pages with Italian instructions were measured equal to English (2026-09-30); only the short
          # questions are compared in both languages now, to keep this job well inside its time limit.
          runrow() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-$2.ppm ai-run/row-$2.txt ai-run/row.gbnf > ai-run/rowanswer-$1-$2.json 2> ai-run/row-$1-$2.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/row-$1-$2.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/row-$1-$2.log; }
          RECEIPT_AI_REPEAT=1 runrow 2b filetto
          grep -h 'reuse=' ai-run/row-2b-filetto.log || true
          if grep -q 'reuse=DIFFERENT' ai-run/row-2b-filetto.log; then echo "::error::the second question on the same engine answered differently"; exit 1; fi
          # A different question on the same picture (the processed picture reused) must answer as on a fresh engine.
          RECEIPT_AI_THEN=ai-run/number-filetto-en.txt,ai-run/number.gbnf,ai-run/then-number-2b.txt runrow 2b filetto
          grep -h 'then:' ai-run/row-2b-filetto.log || true
          runrow 2b candeggina
          runrow 4b filetto
          runrow 4b candeggina
          runrowit() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-$2.ppm ai-run/row-$2-it.txt ai-run/row.gbnf > ai-run/rowanswer-$1-$2-it.json 2> ai-run/row-$1-$2-it.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/row-$1-$2-it.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/row-$1-$2-it.log; }
          runrowit 2b filetto
          runrowit 2b candeggina
          runrowit 4b filetto
          runrowit 4b candeggina
          # Multiple choice (one letter to write): how much faster than a whole line, and is it right?
          runchoice() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-filetto.ppm ai-run/choice-filetto-$2.txt ai-run/choice.gbnf > ai-run/choiceanswer-$1-$2.txt 2> ai-run/choice-$1-$2.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/choice-$1-$2.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/choice-$1-$2.log; }
          runchoice 2b en
          runchoice 2b it
          runchoice 4b en
          runchoice 4b it
          # One number (a quantity the OCR missed): the answer is a few characters.
          runnumber() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-filetto.ppm ai-run/number-filetto-$2.txt ai-run/number.gbnf > ai-run/numberanswer-$1-$2.txt 2> ai-run/number-$1-$2.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/number-$1-$2.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/number-$1-$2.log; }
          runnumber 2b en
          if ! diff -q <(tr -d '[:space:]' < ai-run/then-number-2b.txt) <(tr -d '[:space:]' < ai-run/numberanswer-2b-en.txt); then
            echo "::error::reusing the processed picture changed the answer: $(cat ai-run/then-number-2b.txt) vs $(cat ai-run/numberanswer-2b-en.txt)"; exit 1
          fi
          runnumber 2b it
          runnumber 4b en
          runnumber 4b it
          # The column headings (one letter per heading): what each column holds, for a layout the app does not know.
          runlayout() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/layout.ppm ai-run/layout-$2.txt ai-run/layout.gbnf > ai-run/layoutanswer-$1-$2.txt 2> ai-run/layout-$1-$2.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/layout-$1-$2.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/layout-$1-$2.log; }
          runlayout 2b en
          runlayout 2b it
          runlayout 4b en
          # The trained model, asked exactly as the app asks it (short questions), next to the 2B it was trained from.
          if [ -s models/kr.gguf ] && [ -s models/kr-mmproj.gguf ]; then
            cp ai-run/row-filetto.ppm ai-run/row-filetto-compact.ppm; cp ai-run/row-candeggina.ppm ai-run/row-candeggina-compact.ppm
            for m in kr 2b; do
              runrow $m filetto-compact; runrow $m candeggina-compact
              runchoice $m compact; runnumber $m compact; runlayout $m compact
            done
          else
            echo "::warning::trained model not downloaded: not checked"
          fi
      - name: Check the answers
        run: AI_ANSWER_DIR=$PWD/ai-run ./gradlew :core:test --tests '*AiModelCheckTest.check*' --rerun --quiet
      - name: Publish results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os
          def note(title, text):
              text = text[:3800].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::notice title={title}::{text}')
          if os.path.exists('ai-run/layout-report.txt'):
              note('AI column headings report', open('ai-run/layout-report.txt').read())
          if os.path.exists('ai-run/number-report.txt'):
              note('AI one-number report', open('ai-run/number-report.txt').read())
          if os.path.exists('ai-run/choice-report.txt'):
              note('AI multiple choice report', open('ai-run/choice-report.txt').read())
          if os.path.exists('ai-run/row-report.txt'):
              note('AI line check report', open('ai-run/row-report.txt').read())
          if os.path.exists('ai-run/report.txt'):
              note('AI model check report', open('ai-run/report.txt').read())
          for f in sorted(glob.glob('ai-run/*.log')):
              lines = [l for l in open(f, errors='replace').read().splitlines() if 'prompt=' in l or 'Maximum resident' in l or 'Elapsed' in l or 'error' in l.lower()]
              note('AI run ' + os.path.basename(f), '\n'.join(lines[-8:]))
          for f in sorted(glob.glob('ai-run/answer-*.json')):
              note('AI answer ' + os.path.basename(f), open(f, errors='replace').read())
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ai-model-check
          path: ai-run/
