name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fetch llama.cpp (pinned)
        run: git clone --depth 1 --branch b11242 https://github.com/ggml-org/llama.cpp third_party/llama.cpp

      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Compile instrumented tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugAndroidTestKotlin --stacktrace 2>&1 | tee -a build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # Surface compiler / Gradle errors as annotations so they are visible without the raw log.
          errs=$(grep -E '^e: |error:|^\* What went wrong|^> |Could not |FAILED|CMake Error|ninja: build stopped' build.log | grep -v '^> Task' | head -60)
          errs="${errs//'%'/'%25'}"
          errs="${errs//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errs}"

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/

  # Runs the Room migration and repository tests on a real Android emulator.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Fetch llama.cpp (pinned)
        run: git clone --depth 1 --branch b11242 https://github.com/ggml-org/llama.cpp third_party/llama.cpp
      - name: Download a tiny vision model for the AI reader test
        run: |
          mkdir -p ai-test
          curl -fsSL --retry 3 -o ai-test/model.gguf https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/SmolVLM-256M-Instruct-Q8_0.gguf
          curl -fsSL --retry 3 -o ai-test/mmproj.gguf https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
          ls -la ai-test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 1200
          script: chmod +x gradlew && adb shell mkdir -p /data/local/tmp/ai-test && adb push ai-test/model.gguf /data/local/tmp/ai-test/model.gguf && adb push ai-test/mmproj.gguf /data/local/tmp/ai-test/mmproj.gguf && (./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace > inst.log 2>&1; rc=$?; adb shell run-as com.kitchenreceipts.app cat files/ocr-e2e.txt > ocr-e2e.txt 2>/dev/null; adb shell run-as com.kitchenreceipts.app cat files/ai-e2e.txt > ai-e2e.txt 2>/dev/null; exit $rc)
      # The emulator sometimes fails to boot on a busy runner: one more attempt before calling it a failure.
      - name: Run instrumented tests on emulator (second attempt)
        if: steps.emu1.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 1200
          script: chmod +x gradlew && adb shell mkdir -p /data/local/tmp/ai-test && adb push ai-test/model.gguf /data/local/tmp/ai-test/model.gguf && adb push ai-test/mmproj.gguf /data/local/tmp/ai-test/mmproj.gguf && (./gradlew :app:connectedDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace > inst.log 2>&1; rc=$?; adb shell run-as com.kitchenreceipts.app cat files/ocr-e2e.txt > ocr-e2e.txt 2>/dev/null; adb shell run-as com.kitchenreceipts.app cat files/ai-e2e.txt > ai-e2e.txt 2>/dev/null; exit $rc)
      - name: Publish OCR end-to-end output
        if: always()
        shell: bash
        run: |
          # Annotations are cut at 4 KB: publish the file in up to 10 chunks.
          python3 - <<'PY'
          import os
          if os.path.exists('ai-e2e.txt') and os.path.getsize('ai-e2e.txt') > 0:
              t = open('ai-e2e.txt', encoding='utf-8', errors='replace').read()[:3800]
              print('::notice title=AI reader on emulator::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          if not os.path.exists('ocr-e2e.txt') or os.path.getsize('ocr-e2e.txt') == 0:
              print('::notice title=OCR end-to-end output::no output file')
          else:
              text = open('ocr-e2e.txt', encoding='utf-8', errors='replace').read()
              chunks = [text[i:i + 3800] for i in range(0, len(text), 3800)][:10]
              for n, c in enumerate(chunks, 1):
                  c = c.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::notice title=OCR end-to-end output {n}/{len(chunks)}::{c}')
          PY
      - name: Report instrumented test failures
        if: failure()
        shell: bash
        run: |
          # Failing tests from the JUnit XML reports, then Gradle/emulator errors from the log.
          msg=$(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          out = []
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.findall('failure')) + list(tc.findall('error')):
                      out.append(f"{tc.get('classname')}.{tc.get('name')}: " + (fail.text or fail.get('message') or '')[:1500])
          print('\n'.join(out) if out else 'no JUnit results found')
          PY
          )
          # (|| true: no match must not end the step before the report is printed)
          log=$(grep -E 'FAILED|Exception|What went wrong|^> |error:|INSTRUMENTATION|Timeout' inst.log 2>/dev/null | grep -v '^> Task' | head -40 || true)
          all="$msg"$'\n'"--- log ---"$'\n'"$log"
          all="${all//'%'/'%25'}"
          all="${all//$'\n'/'%0A'}"
          echo "::error title=Instrumented tests::${all}"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/

  # Runs the real AI models (Qwen3-VL 2B and 4B, as the app uses them) with the app's own reader code, prompt
  # and grammar on a synthetic invoice photo, and reports how well they read it.
  ai-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Fetch llama.cpp (pinned)
        run: git clone --depth 1 --branch b11242 https://github.com/ggml-org/llama.cpp third_party/llama.cpp
      - name: Build the reader for the desktop
        run: |
          cmake -S tools/ai-cli -B build-cli -DCMAKE_BUILD_TYPE=Release > cmake.log
          cmake --build build-cli --target receipt-ai-cli -j 4 > build-cli.log 2>&1 || (tail -40 build-cli.log; exit 1)
      - uses: actions/cache@v4
        with:
          path: models
          key: qwen3vl-2b-4b-q4km-v1
      - name: Download models
        run: |
          mkdir -p models && cd models
          base=https://huggingface.co/Qwen
          get() { [ -s "$2" ] || curl -fsSL --retry 3 -o "$2" "$1"; }
          get $base/Qwen3-VL-2B-Instruct-GGUF/resolve/main/Qwen3VL-2B-Instruct-Q4_K_M.gguf 2b.gguf
          get $base/Qwen3-VL-2B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf 2b-mmproj.gguf
          get $base/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf 4b.gguf
          get $base/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf 4b-mmproj.gguf
          ls -la
      - name: Prompt, grammar and invoice photo
        run: |
          pip install --quiet pillow
          mkdir -p ai-run
          AI_EXPORT_DIR=$PWD/ai-run ./gradlew :core:test --tests '*AiModelCheckTest.exportPrompt' --rerun --quiet
          python3 tools/ai-cli/make_invoice.py ai-run
      - name: Run the models
        run: |
          run() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/$4.ppm ai-run/$2 ai-run/grammar.gbnf > ai-run/answer-$3.json 2> ai-run/$3.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/$3.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/$3.log; }
          run 2b instruction.txt 2b-full invoice
          run 2b instruction.txt 2b-crop invoice-crop
          run 4b instruction.txt 4b-crop invoice-crop
          # Whole pages with Italian instructions were measured equal to English (2026-09-30); only the short
          # questions are compared in both languages now, to keep this job well inside its time limit.
          runrow() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-$2.ppm ai-run/row-$2.txt ai-run/row.gbnf > ai-run/rowanswer-$1-$2.json 2> ai-run/row-$1-$2.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/row-$1-$2.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/row-$1-$2.log; }
          runrow 2b filetto
          runrow 2b candeggina
          runrow 4b filetto
          runrow 4b candeggina
          runrowit() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-$2.ppm ai-run/row-$2-it.txt ai-run/row.gbnf > ai-run/rowanswer-$1-$2-it.json 2> ai-run/row-$1-$2-it.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/row-$1-$2-it.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/row-$1-$2-it.log; }
          runrowit 2b filetto
          runrowit 2b candeggina
          runrowit 4b filetto
          runrowit 4b candeggina
          # Multiple choice (one letter to write): how much faster than a whole line, and is it right?
          runchoice() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-filetto.ppm ai-run/choice-filetto-$2.txt ai-run/choice.gbnf > ai-run/choiceanswer-$1-$2.txt 2> ai-run/choice-$1-$2.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/choice-$1-$2.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/choice-$1-$2.log; }
          runchoice 2b en
          runchoice 2b it
          runchoice 4b en
          runchoice 4b it
          # One number (a quantity the OCR missed): the answer is a few characters.
          runnumber() { t0=$(date +%s); ./build-cli/receipt-ai-cli models/$1.gguf models/$1-mmproj.gguf ai-run/row-filetto.ppm ai-run/number-filetto-$2.txt ai-run/number.gbnf > ai-run/numberanswer-$1-$2.txt 2> ai-run/number-$1-$2.log || true; echo "Elapsed seconds: $(( $(date +%s) - t0 ))" >> ai-run/number-$1-$2.log; grep -E 'prompt=|Elapsed|failed|error' ai-run/number-$1-$2.log; }
          runnumber 2b en
          runnumber 2b it
          runnumber 4b en
          runnumber 4b it
      - name: Check the answers
        run: AI_ANSWER_DIR=$PWD/ai-run ./gradlew :core:test --tests '*AiModelCheckTest.check*' --rerun --quiet
      - name: Publish results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os
          def note(title, text):
              text = text[:3800].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::notice title={title}::{text}')
          if os.path.exists('ai-run/number-report.txt'):
              note('AI one-number report', open('ai-run/number-report.txt').read())
          if os.path.exists('ai-run/choice-report.txt'):
              note('AI multiple choice report', open('ai-run/choice-report.txt').read())
          if os.path.exists('ai-run/row-report.txt'):
              note('AI line check report', open('ai-run/row-report.txt').read())
          if os.path.exists('ai-run/report.txt'):
              note('AI model check report', open('ai-run/report.txt').read())
          for f in sorted(glob.glob('ai-run/*.log')):
              lines = [l for l in open(f, errors='replace').read().splitlines() if 'prompt=' in l or 'Maximum resident' in l or 'Elapsed' in l or 'error' in l.lower()]
              note('AI run ' + os.path.basename(f), '\n'.join(lines[-8:]))
          for f in sorted(glob.glob('ai-run/answer-*.json')):
              note('AI answer ' + os.path.basename(f), open(f, errors='replace').read())
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ai-model-check
          path: ai-run/
